[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "nexus-platform"
version = "0.1.0"
description = "A production-oriented microservices and AI learning platform built with Python and FastAPI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.150.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
